<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#143d32">
    <title>Acesso Comercial | Consulta CNPJ</title>
    <link rel="stylesheet" href="/static/comercial-login.css">
</head>
<body>
    <main class="login-shell">
        <a class="brand" href="/" aria-label="Voltar ao início">
            <span class="brand-mark" aria-hidden="true">C</span>
            <span>Consulta CNPJ</span>
        </a>
        <section class="login-panel" aria-labelledby="login-title">
            <p class="eyebrow">ÁREA RESTRITA</p>
            <h1 id="login-title">Acesso Comercial</h1>
            <p class="login-subtitle">Entre com suas credenciais para continuar.</p>
            {% if settings_missing and not error %}
            <p class="form-message error" role="alert">O acesso ainda não foi configurado no servidor.</p>
            {% endif %}
            {% if error %}
            <p class="form-message error" role="alert">{{ error }}</p>
            {% endif %}
            <form method="post" action="/comercial/login">
                <label for="username">Usuário</label>
                <input id="username" name="username" type="text" autocomplete="username" required autofocus>
                <label for="password">Senha</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">Entrar</button>
            </form>
            <a class="back-link" href="/">Voltar aos perfis</a>
        </section>
    </main>
</body>
</html>
